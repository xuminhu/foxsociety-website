<style>
:root{
  --page:#fafafa;--surface:#ffffff;--cream:#f5f0e8;--ink:#1a1a1a;--muted:#5d6670;--line:#e4ded3;--line2:#efeae1;
  --tan:#c9a86c;--slate:#2c3e50;--today:#c9a86c;
  --uwc:#2f7f7a;--sas:#b8433a;--ykps:#5f8a2e;--ph:#3d5a98;--shs:#8c2f4c;
  --sat:#7b4fa6;--act:#b56d12;--ap:#1f6fb2;--alevel:#8a5a44;--igcse:#b0487a;--ib:#4d6b78;
  --shadow:0 1px 2px rgba(44,62,80,.06),0 4px 14px rgba(44,62,80,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#14191f;--surface:#1b222a;--cream:#232b34;--ink:#ece7de;--muted:#9aa4ae;--line:#323c47;--line2:#28313b;
  --tan:#d4a574;--slate:#0f151b;--uwc:#4fb0a9;--sas:#e07a70;--ykps:#8fbf5a;--ph:#7d9ae0;--shs:#d77a95;--sat:#b08be0;--act:#e0a050;--ap:#6aa8e8;--alevel:#c99a82;--igcse:#e08ab5;--ib:#8fb0bd;--shadow:none;}}
:root[data-theme="dark"]{
  --page:#14191f;--surface:#1b222a;--cream:#232b34;--ink:#ece7de;--muted:#9aa4ae;--line:#323c47;--line2:#28313b;
  --tan:#d4a574;--slate:#0f151b;--uwc:#4fb0a9;--sas:#e07a70;--ykps:#8fbf5a;--ph:#7d9ae0;--shs:#d77a95;--sat:#b08be0;--act:#e0a050;--ap:#6aa8e8;--alevel:#c99a82;--igcse:#e08ab5;--ib:#8fb0bd;--shadow:none;}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.brand{font:600 12px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--tan);font-weight:600}
h1{font:700 clamp(24px,4vw,34px)/1.2 "Noto Serif SC","Songti SC","STSong","SimSun",serif;margin:8px 0 6px;text-wrap:balance}
h1 span{font-family:"Playfair Display",Georgia,serif;font-weight:600}
.sub{color:var(--muted);margin:0;max-width:62ch}
h2{font:700 19px/1.3 "Noto Serif SC","Songti SC","STSong","SimSun",serif;margin:0 0 4px}
h2::after{content:"";display:block;width:56px;height:3px;background:var(--tan);margin-top:8px}
section{margin-top:34px}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.note{color:var(--muted);font-size:12.5px}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 9px;font:500 13px Inter,sans-serif;cursor:pointer}
.chip .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.chip:focus-visible,.seg button:focus-visible,.navbtn:focus-visible,.day:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:500 13px Inter,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--slate);color:#fff}
.filters{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.filters .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .lbl{font-size:12px;color:var(--muted);width:44px;flex:none}

/* comparison table */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line2)}
thead th{font:600 12px Inter,sans-serif;color:var(--muted);letter-spacing:.04em;background:var(--cream);border-bottom:1px solid var(--line)}
thead th i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c);font-style:normal}
tbody th{font:600 13px "Noto Serif SC",serif;white-space:nowrap}
tbody tr:last-child>*{border-bottom:0}
td .d{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
td.na{color:var(--muted);font-size:12.5px}

/* month */
.monthbar{display:flex;align-items:center;gap:10px}
.monthbar h3{font:700 18px "Noto Serif SC",serif;margin:0;min-width:128px;text-align:center}
.navbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.navbtn:disabled{opacity:.35;cursor:default}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px 10px;font:600 12px Inter,sans-serif;color:var(--muted);background:var(--cream);border-bottom:1px solid var(--line)}
.day{min-height:112px;border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--page);cursor:default}
.day.wk .num{color:var(--muted)}
.day.sel{box-shadow:inset 0 0 0 2px var(--tan)}
.num{font:500 12.5px "IBM Plex Mono",monospace;display:flex;justify-content:space-between;align-items:center}
.day.today .num b{background:var(--tan);color:#1a1a1a;border-radius:999px;padding:0 6px}
.num b{font-weight:500}
.ev{display:flex;align-items:center;gap:4px;border-radius:4px;padding:1px 5px;font-size:11px;line-height:1.35;min-width:0}
.ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.off{background:var(--c);color:#fff}
:root[data-theme="dark"] .ev.off{color:#10151a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev.off{color:#10151a}}
.ev.other{background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--ink);box-shadow:inset 2px 0 0 var(--c)}
.ev.exam{box-shadow:inset 2px 0 0 var(--c),inset 0 0 0 1px var(--c)}
.ev em{font-style:normal;font-weight:600;flex:none}
.bands{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;padding-top:2px}
.band{font-size:10px;line-height:1.4;padding:0 4px;border-radius:3px;border-bottom:2px solid var(--c);color:var(--muted);background:color-mix(in srgb,var(--c) 8%,transparent)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.dots i.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.detail{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.detail h4{margin:0 0 8px;font:700 15px "Noto Serif SC",serif}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.legend .ev{display:inline-flex;--c:var(--slate)}

/* list */
.mgroup{margin-bottom:18px}
.mgroup h3{font:700 15px "Noto Serif SC",serif;margin:0 0 6px;color:var(--muted)}
.item{display:grid;grid-template-columns:150px 92px 1fr;gap:12px;align-items:start;padding:10px 14px;background:var(--surface);border:1px solid var(--line2);border-radius:8px;margin-bottom:6px}
.item.past{opacity:.5}
td.k{white-space:nowrap}
td.k b{display:inline-flex;align-items:center;gap:6px;color:var(--c)}
td.k b::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
td .ln{display:block;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12.5px;line-height:1.7}
.item .when{font:500 13px "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.item .when small{display:block;color:var(--muted);font-size:11.5px}
.sch{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:var(--c)}
.sch::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:0 8px;margin-right:6px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.pill.off{background:var(--ink);color:var(--page);border-color:var(--ink)}
.pill.result{border-color:var(--ink);color:var(--ink);font-weight:600}
.pill.reg{border-style:dashed}
.pill.exam{border-color:var(--tan);color:var(--ink);background:color-mix(in srgb,var(--tan) 22%,transparent)}
.ttl{font-weight:500}
.ttl small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.empty{color:var(--muted);padding:20px 0}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
footer{margin-top:40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}
footer ul{margin:6px 0 0;padding-left:18px}

@media (max-width:760px){
  .day{min-height:58px;padding:4px}
  .ev,.bands{display:none}
  .dots{display:flex}
  .item{grid-template-columns:1fr;gap:4px}
  .monthbar h3{min-width:100px;font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── passcode gate ── */
.gate{max-width:430px;margin:10vh auto 0;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tan);border-radius:12px;box-shadow:var(--shadow);padding:34px 32px 28px;text-align:center}
.gate img{height:96px;width:auto}
.gate h1{font-size:21px;margin:16px 0 4px}
.gate .en{font-family:"Playfair Display",Georgia,serif;color:var(--tan);font-size:14px}
.gate p{color:var(--muted);font-size:13.5px;margin:14px 0 18px;line-height:1.7}
.gate form{display:flex;gap:8px}
.gate input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font:15px Inter,"PingFang SC",sans-serif;color:var(--ink);background:var(--page);outline:none}
.gate input:focus{border-color:var(--tan);box-shadow:0 0 0 3px color-mix(in srgb,var(--tan) 25%,transparent)}
.gate button{border:1px solid var(--slate);background:var(--slate);color:#fff;border-radius:8px;padding:11px 20px;font:600 14px Inter,"PingFang SC",sans-serif;cursor:pointer}
.gate button:disabled{opacity:.55;cursor:default}
.gate .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--sas)}
.gate .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
.gatewrap{padding:0 16px}
</style>
</head>

<script>
(function(){
  const el=document.getElementById('data'), gate=document.getElementById('gate'), form=document.getElementById('gateForm'),
        pw=document.getElementById('pw'), btn=document.getElementById('gateBtn'), msg=document.getElementById('gateMsg'), app=document.getElementById('app');
  const b642buf=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
  if(!(window.crypto&&crypto.subtle)){ msg.textContent='此页面需要通过 https:// 网址打开（本地文件方式无法解锁）。'; pw.disabled=btn.disabled=true; return; }
  async function unlock(pass){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b642buf(el.dataset.salt),iterations:+el.dataset.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642buf(el.dataset.iv)},key,b642buf(el.textContent.trim()));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function start(p){
    el.remove(); gate.parentNode.remove();
    app.innerHTML=p.html; app.hidden=false;
    const sc=document.createElement('script'); sc.textContent=p.js; document.body.appendChild(sc);
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault(); const pass=pw.value.trim(); if(!pass) return;
    btn.disabled=true; msg.textContent='正在验证…';
    try{ const p=await unlock(pass); try{sessionStorage.setItem('fs-cal-pass',pass);}catch(_){} start(p); }
    catch(err){ msg.textContent='口令不正确，请重试。Incorrect passcode.'; btn.disabled=false; pw.select(); }
  });
  let saved=null; try{saved=sessionStorage.getItem('fs-cal-pass');}catch(_){}
  if(saved) unlock(saved).then(start).catch(()=>{try{sessionStorage.removeItem('fs-cal-pass');}catch(_){}});
})();
</script>
