<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狐狸学社 · 美国大学专业毕业收入查询</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root {
    --primary: #1a1a1a;
    --gold: #d4a574;
    --gold-dark: #b8925f;
    --text: #333;
    --text-light: #666;
    --bg: #fafafa;
    --white: #fff;
    --serif: 'Noto Serif SC', 'Songti SC', serif;
    --sans: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--sans);
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
}
/* Discourage copying: text in the page cannot be selected (inputs still can). */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, select { -webkit-user-select: text; user-select: text; }
img { -webkit-user-drag: none; }

.bar {
    background: var(--white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
}
.bar-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--primary);
}
.brand img { height: 40px; width: auto; }
.brand .cn { display: block; font-family: var(--serif); font-weight: 700; font-size: 17px; line-height: 1.2; }
.brand .en { display: block; font-family: 'Playfair Display', serif; font-size: 13px; color: var(--text-light); letter-spacing: 1px; line-height: 1.2; }
.lang { display: flex; gap: 6px; }
.lang button {
    font: inherit;
    font-size: 14px;
    border: none;
    background: none;
    color: var(--text-light);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
}
.lang button[aria-pressed="true"] { color: var(--primary); background: rgba(212,165,116,0.15); }

.hero {
    padding: 64px 24px 72px;
    background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
    color: #fff;
    text-align: center;
}
.hero h1 {
    font-family: var(--serif);
    font-size: clamp(1.7rem, 5.5vw, 2.5rem);
    margin-bottom: 12px;
}
.hero > p { max-width: 720px; margin: 0 auto; color: rgba(255,255,255,0.8); }
.notice {
    max-width: 760px;
    margin: 28px auto 0;
    padding: 16px 20px;
    border: 1px solid rgba(212,165,116,0.6);
    border-left: 4px solid var(--gold);
    border-radius: 10px;
    background: rgba(212,165,116,0.12);
    text-align: left;
    font-size: 15px;
    line-height: 1.7;
}
.notice-title { display: block; color: var(--gold); margin-bottom: 4px; }
.notice p { color: rgba(255,255,255,0.9); }
.notice p strong { color: #fff; }

.wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px 64px; }
.panel {
    background: var(--white);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    padding: 24px;
    margin-top: -32px;
    position: relative;
    display: grid;
    grid-template-columns: 1.4fr 1.4fr 1fr 1fr auto;
    gap: 16px;
    align-items: end;
}
.field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; }
.field input, .field select {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    color: var(--text);
}
.field input:focus, .field select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,165,116,0.25);
}
.reset {
    font: inherit;
    font-size: 15px;
    padding: 10px 18px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
}
.reset:hover { border-color: var(--gold); }
.summary { margin: 28px 0 16px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
.count { font-size: 15px; color: var(--text-light); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--text-light); }
.stats b { color: var(--primary); font-variant-numeric: tabular-nums; }
.list { list-style: none; display: grid; gap: 10px; }
.item {
    background: var(--white);
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 12px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 240px;
    gap: 16px;
    align-items: center;
}
.name {
    display: block;
    width: 100%;
    min-width: 0;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    text-align: left;
    color: inherit;
    cursor: pointer;
}
.name .zh { font-weight: 600; color: var(--primary); line-height: 1.4; }
.name .en { font-size: 13px; color: var(--text-light); line-height: 1.4; overflow-wrap: anywhere; }
.name:hover .zh, .name:focus-visible .zh { color: var(--gold-dark); text-decoration: underline; }
.state {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 0 5px;
    margin-left: 6px;
    vertical-align: 2px;
}
.money { text-align: right; }
.amt { font-size: 20px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.amt small { font-size: 12px; font-weight: 400; color: var(--text-light); }
.meter { height: 6px; background: #f0ebe4; border-radius: 3px; margin: 6px 0 6px auto; overflow: hidden; }
.meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-dark)); border-radius: 3px; }
.meta { font-size: 12px; color: var(--text-light); line-height: 1.5; }
.flag {
    display: inline-block;
    font-size: 12px;
    color: #a0442c;
    background: rgba(160,68,44,0.08);
    border-radius: 4px;
    padding: 1px 6px;
    margin-top: 4px;
}
.status { padding: 40px 0; text-align: center; color: var(--text-light); }
.more, .cta a {
    display: block;
    margin: 24px auto 0;
    font: inherit;
    font-size: 15px;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #1a1a1a;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
}
.notes {
    margin-top: 56px;
    padding-top: 32px;
    border-top: 1px solid rgba(0,0,0,0.08);
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.8;
}
.notes h2 { font-family: var(--serif); font-size: 20px; color: var(--primary); margin-bottom: 12px; }
.notes p { margin-bottom: 12px; }
.cta { margin-top: 32px; padding: 28px; border-radius: 16px; background: rgba(212,165,116,0.1); text-align: center; }
.cta p { margin-bottom: 0; color: var(--text); }
.cta a { display: inline-block; margin-top: 16px; }
.foot { text-align: center; font-size: 12px; color: #999; padding: 24px 16px 32px; }

@media (max-width: 900px) {
    .panel { grid-template-columns: 1fr 1fr; }
    .field.wide, .reset { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
    .bar-inner { padding: 0 16px; }
    .hero { padding: 40px 16px 56px; }
    .notice { margin-top: 20px; padding: 14px 16px; font-size: 14px; }
    .wrap { padding: 0 16px 48px; }
    .panel { padding: 16px; gap: 12px; }
    .item { grid-template-columns: 1fr; gap: 8px; padding: 14px 16px; }
    .money { text-align: left; }
    .meter { margin-left: 0; }
}
@media print {
    body * { display: none !important; }
}
</style>
</head>
<body>
<header class="bar">
    <div class="bar-inner">
        <a class="brand" href="https://www.foxsociety.com.cn/" data-href-en="https://www.foxsociety.com.cn/en/">
            <img src="/images/logo.png" alt="" draggable="false">
            <span><span class="cn">狐狸学社</span><span class="en">Fox Society</span></span>
        </a>
        <div class="lang" role="group" aria-label="Language">
            <button type="button" data-lang="zh" aria-pressed="true">中文</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
    </div>
</header>

<section class="hero">
    <h1 data-t="title"></h1>
    <p data-t="subtitle"></p>
    <div class="notice" role="note">
        <strong class="notice-title" data-t="noticeTitle"></strong>
        <p data-t-html="notice"></p>
    </div>
</section>

<div class="wrap">
    <form class="panel" role="search" onsubmit="return false">
        <div class="field wide">
            <label for="f-school" data-t="schoolLabel"></label>
            <input id="f-school" type="search" autocomplete="off" data-ph="schoolPh">
        </div>
        <div class="field wide">
            <label for="f-major" data-t="majorLabel"></label>
            <input id="f-major" type="search" autocomplete="off" data-ph="majorPh">
        </div>
        <div class="field">
            <label for="f-state" data-t="stateLabel"></label>
            <select id="f-state"><option value="" data-t="stateAll"></option></select>
        </div>
        <div class="field">
            <label for="f-sort" data-t="sortLabel"></label>
            <select id="f-sort">
                <option value="high" data-t="sortHigh"></option>
                <option value="low" data-t="sortLow"></option>
                <option value="school" data-t="sortSchool"></option>
            </select>
        </div>
        <button type="button" class="reset" id="f-reset" data-t="reset"></button>
    </form>

    <div class="summary" aria-live="polite">
        <span class="count" id="count"></span>
        <span class="stats" id="stats"></span>
    </div>
    <p class="status" id="status" data-t="loading"></p>
    <ol class="list" id="list"></ol>
    <button type="button" class="more" id="more" hidden data-t="loadMore"></button>

    <section class="notes">
        <h2 data-t="aboutHeading"></h2>
        <p data-t="about1"></p>
        <p data-t="about2"></p>
        <p data-t="about3"></p>
        <p data-t="translationNote"></p>
        <p data-t="source"></p>
        <div class="cta">
            <p data-t="cta"></p>
            <a href="https://www.foxsociety.com.cn/contact/" data-href-en="https://www.foxsociety.com.cn/en/contact/" data-t="ctaButton"></a>
        </div>
    </section>
</div>

        about2: '“低于高中毕业生收入基准”指该专业毕业生收入中位数低于高中毕业生收入中位数（全国基准为 $34,808，部分项目使用所在州的基准）。“学校年均净价格”为学校整体数据，并非某个专业单独的费用，部分学校没有该数据。',

        schoolLabel: 'School', schoolPh: 'e.g. UCLA, Purdue, 哈佛',
        majorLabel: 'Major', majorPh: 'e.g. Economics, 计算机',
        stateLabel: 'State', stateAll: 'All states',
        sortLabel: 'Sort', sortHigh: 'Earnings: high to low', sortLow: 'Earnings: low to high', sortSchool: 'School name',
        reset: 'Clear',
        loading: 'Loading data…',
        loadError: 'Could not load the data. Please refresh the page.',
        count: '{n} programs found',
        none: 'No matching programs. Try a different keyword (English or Chinese).',
        median: 'Median', highest: 'Highest', lowest: 'Lowest',
        cohort: '{n} graduates in cohort', netPrice: 'School net price {v}',
        below: 'Below high-school earnings benchmark',
        filterSchool: 'Only this school', filterMajor: 'Only this major',
        loadMore: 'Show more', perYear: '/yr',
        aboutHeading: 'About the data',
        about1: "Earnings are median incomes reported on IRS tax records four years after completion, for bachelor's graduates who received federal student aid and finished in 2017–18 or 2018–19. Programs are listed only if they had more than 15 aided graduates. Majors follow the NCES CIP classification.",

        about3: 'Differences between schools also reflect regional pay levels, student populations and career paths, so treat these numbers as one input among many.',

        source: 'Source: The HEA Group analysis of federal earnings data, as published in The New York Times interactive "A College-by-College Guide to Which Majors Pay Off — or Don\'t" (Arfa Momin and Ron Lieber, Oct. 7, 2026).',

const PAGE = 50;
const METER_MAX = 300000;
const $ = (id) => document.getElementById(id);
const els = {
    school: $('f-school'), major: $('f-major'), state: $('f-state'), sort: $('f-sort'),
    reset: $('f-reset'), count: $('count'), stats: $('stats'), status: $('status'),
    list: $('list'), more: $('more'),
};
const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const num = new Intl.NumberFormat('en-US');
const fill = (tpl, k, v) => tpl.replace('{' + k + '}', v);
const norm = (s) => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[.,'’&()\-\/]/g, ' ').replace(/\s+/g, ' ').trim();

let lang = 'zh';
let T = I18N.zh;
let S = null, M = null, P = null;  // schools, majors, programs (kept inside this closure only)
let schoolHay = [], majorHay = [];
let schoolId = null, majorId = null;  // set when a name is clicked: exact match
let results = [], shown = 0;

// ---- data: the payload is scrambled so it is not readable as plain text ----
function decode() {
    const raw = atob(document.getElementById('payload').textContent.trim());
    const bytes = new Uint8Array(raw.length);
    let k = 1594630182 >>> 0;
    for (let i = 0; i < raw.length; i++) {
        k = (Math.imul(k, 1103515245) + 12345) >>> 0;
        bytes[i] = raw.charCodeAt(i) ^ (k >>> 16) & 255;
    }
    const d = JSON.parse(new TextDecoder().decode(bytes));
    document.getElementById('payload').remove();
    return d;
}

// ---- language ----
function setLang(l) {
    lang = I18N[l] ? l : 'zh';
    T = I18N[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = T.docTitle;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[el.dataset.t]; });
    document.querySelectorAll('[data-t-html]').forEach((el) => { el.innerHTML = T[el.dataset.tHtml]; });
    document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = T[el.dataset.ph]; });
    document.querySelectorAll('[data-href-en]').forEach((el) => {
        if (!el.dataset.hrefZh) el.dataset.hrefZh = el.getAttribute('href');
        el.href = lang === 'en' ? el.dataset.hrefEn : el.dataset.hrefZh;
    });
    document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    try { localStorage.setItem('fs-earnings-lang', lang); } catch (e) {}
    if (P) {
        if (schoolId !== null) els.school.value = schoolLabel(schoolId);
        if (majorId !== null) els.major.value = majorLabel(majorId);
        run();
    }
}
const schoolLabel = (i) => (lang === 'zh' ? S[i][1] : S[i][0]) + ' (' + S[i][2] + ')';
const majorLabel = (i) => (lang === 'zh' ? M[i][1] : M[i][0]);

// ---- search ----
function matcher(query, hay) {
    const tokens = norm(query).split(' ').filter(Boolean);
    if (!tokens.length) return null;
    const ok = new Uint8Array(hay.length);
    for (let i = 0; i < hay.length; i++) ok[i] = tokens.every((t) => hay[i].includes(t)) ? 1 : 0;
    return ok;
}

function median(sorted) {
    const n = sorted.length, m = n >> 1;
    return n % 2 ? sorted[m] : Math.round((sorted[m - 1] + sorted[m]) / 2);
}

function run() {
    const schoolOk = schoolId !== null ? null : matcher(els.school.value, schoolHay);
    const majorOk = majorId !== null ? null : matcher(els.major.value, majorHay);
    const state = els.state.value;

    results = P.filter((p) =>
        (schoolId === null ? (!schoolOk || schoolOk[p[0]]) : p[0] === schoolId) &&
        (majorId === null ? (!majorOk || majorOk[p[1]]) : p[1] === majorId) &&
        (!state || S[p[0]][2] === state));

    const sort = els.sort.value;
    if (sort === 'low') {
        results.sort((a, b) => a[2] - b[2]);
    } else if (sort === 'school') {
        const key = lang === 'zh' ? 1 : 0;
        const coll = new Intl.Collator(lang === 'zh' ? 'zh-CN' : 'en');
        results.sort((a, b) => coll.compare(S[a[0]][key], S[b[0]][key]) || b[2] - a[2]);
    }  // 'high' is the order the payload ships in

    shown = 0;
    els.list.textContent = '';
    els.count.textContent = fill(T.count, 'n', num.format(results.length));
    els.stats.textContent = '';
    if (results.length > 1) {
        const vals = results.map((p) => p[2]).sort((a, b) => a - b);
        [[T.median, median(vals)], [T.highest, vals[vals.length - 1]], [T.lowest, vals[0]]].forEach(([label, v]) => {
            const span = document.createElement('span');
            const b = document.createElement('b');
            b.textContent = usd.format(v);
            span.append(label + ' ', b);
            els.stats.append(span);
        });
    }
    els.status.hidden = results.length > 0;
    els.status.textContent = T.none;
    more();
    syncUrl();
}

function nameBlock(zh, en, title, onClick, state) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'name';
    btn.title = title;
    const z = document.createElement('div');
    z.className = 'zh';
    z.textContent = zh;
    if (state) {
        const s = document.createElement('span');
        s.className = 'state';
        s.textContent = state;
        z.append(s);
    }
    const e = document.createElement('div');
    e.className = 'en';
    e.textContent = en;
    btn.append(z, e);
    btn.addEventListener('click', onClick);
    return btn;
}

function more() {
    const frag = document.createDocumentFragment();
    const end = Math.min(results.length, shown + PAGE);
    for (let i = shown; i < end; i++) {
        const p = results[i];
        const s = S[p[0]], m = M[p[1]];
        const li = document.createElement('li');
        li.className = 'item';
        li.append(nameBlock(s[1], s[0], T.filterSchool, () => pick('school', p[0]), s[2]));
        li.append(nameBlock(m[1], m[0], T.filterMajor, () => pick('major', p[1])));

        const money = document.createElement('div');
        money.className = 'money';
        const amt = document.createElement('div');
        amt.className = 'amt';
        amt.textContent = usd.format(p[2]);
        const small = document.createElement('small');
        small.textContent = T.perYear;
        amt.append(small);
        const meter = document.createElement('div');
        meter.className = 'meter';
        const bar = document.createElement('span');
        bar.style.width = Math.min(100, p[2] / METER_MAX * 100).toFixed(1) + '%';
        meter.append(bar);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = fill(T.cohort, 'n', num.format(p[4])) +
            (s[4] != null ? ' · ' + fill(T.netPrice, 'v', usd.format(s[4])) : '');
        money.append(amt, meter, meta);
        if (!p[3]) {
            const flag = document.createElement('div');
            flag.className = 'flag';
            flag.textContent = T.below;
            money.append(flag);
        }
        li.append(money);
        frag.append(li);
    }
    els.list.append(frag);
    shown = end;
    els.more.hidden = shown >= results.length;
}

function pick(kind, id) {
    if (kind === 'school') { schoolId = id; els.school.value = schoolLabel(id); }
    else { majorId = id; els.major.value = majorLabel(id); }
    run();
    els.count.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function syncUrl() {
    const q = new URLSearchParams();
    if (lang !== 'zh') q.set('lang', lang);
    if (schoolId !== null) q.set('sid', S[schoolId][5]);
    else if (els.school.value.trim()) q.set('school', els.school.value.trim());
    if (majorId !== null) q.set('cip', M[majorId][2]);
    else if (els.major.value.trim()) q.set('major', els.major.value.trim());
    if (els.state.value) q.set('state', els.state.value);
    if (els.sort.value !== 'high') q.set('sort', els.sort.value);
    const qs = q.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

function restoreUrl(q) {
    els.state.value = q.get('state') || '';
    if (q.get('sort')) els.sort.value = q.get('sort');
    const sid = S.findIndex((s) => s[5] === q.get('sid'));
    if (sid >= 0) { schoolId = sid; els.school.value = schoolLabel(sid); }
    else els.school.value = q.get('school') || '';
    const mid = M.findIndex((m) => m[2] === q.get('cip'));
    if (mid >= 0) { majorId = mid; els.major.value = majorLabel(mid); }
    else els.major.value = q.get('major') || '';
}

// ---- copy deterrents (inputs keep normal behaviour) ----
const inField = (e) => e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach((ev) =>
    document.addEventListener(ev, (e) => { if (!inField(e)) e.preventDefault(); }));
document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p' || k === 'u' || (!inField(e) && (k === 'a' || k === 'c')))) {
        e.preventDefault();
    }
});

// ---- wire up ----
let timer;
const debounced = () => { clearTimeout(timer); timer = setTimeout(run, 150); };
els.school.addEventListener('input', () => { schoolId = null; debounced(); });
els.major.addEventListener('input', () => { majorId = null; debounced(); });
els.state.addEventListener('change', run);
els.sort.addEventListener('change', run);
els.more.addEventListener('click', more);
els.reset.addEventListener('click', () => {
    schoolId = majorId = null;
    els.school.value = els.major.value = els.state.value = '';
    els.sort.value = 'high';
    run();
    els.school.focus();
});
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

const query = new URLSearchParams(location.search);
let saved = null;
try { saved = localStorage.getItem('fs-earnings-lang'); } catch (e) {}
setLang(query.get('lang') || saved || 'zh');

try {
    const d = decode();
    S = d.s; M = d.m;
    P = [];
    for (let i = 0; i < d.p.length; i += 5) P.push(d.p.slice(i, i + 5));
    schoolHay = S.map((s) => norm([s[0], s[1], s[2], s[3]].join(' ')));
    majorHay = M.map((m) => norm([m[0], m[1], m[2]].join(' ')));
    [...new Set(S.map((s) => s[2]))].sort().forEach((st) => els.state.add(new Option(st, st)));
    restoreUrl(query);
    run();
} catch (e) {
    els.status.textContent = T.loadError;
}
})();
</script>
