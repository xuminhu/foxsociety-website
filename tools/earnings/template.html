    background: none;
    color: var(--text-light);

    border-radius: 4px;

.lang button[aria-pressed="true"] { color: var(--primary); background: rgba(212,165,116,0.15); }

    btn.title = title;
    const z = document.createElement('div');
    z.className = 'zh';
    z.textContent = zh;
    if (state) {
        const s = document.createElement('span');
        s.className = 'state';
        s.textContent = state;
        z.append(s);
    }
    const e = document.createElement('div');
    e.className = 'en';
    e.textContent = en;
    btn.append(z, e);
    btn.addEventListener('click', onClick);
    return btn;
}

function more() {
    const frag = document.createDocumentFragment();
    const end = Math.min(results.length, shown + PAGE);
    for (let i = shown; i < end; i++) {
        const p = results[i];
        const s = S[p[0]], m = M[p[1]];
        const li = document.createElement('li');
        li.className = 'item';
        li.append(nameBlock(s[1], s[0], T.filterSchool, () => pick('school', p[0]), s[2]));
        li.append(nameBlock(m[1], m[0], T.filterMajor, () => pick('major', p[1])));

        const money = document.createElement('div');
        money.className = 'money';
        const amt = document.createElement('div');
        amt.className = 'amt';
        amt.textContent = usd.format(p[2]);
        const small = document.createElement('small');
        small.textContent = T.perYear;
        amt.append(small);
        const meter = document.createElement('div');
        meter.className = 'meter';
        const bar = document.createElement('span');
        bar.style.width = Math.min(100, p[2] / METER_MAX * 100).toFixed(1) + '%';
        meter.append(bar);
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = fill(T.cohort, 'n', num.format(p[4])) +
            (s[4] != null ? ' · ' + fill(T.netPrice, 'v', usd.format(s[4])) : '');
        money.append(amt, meter, meta);
        if (!p[3]) {
            const flag = document.createElement('div');
            flag.className = 'flag';
            flag.textContent = T.below;
            money.append(flag);
        }
        li.append(money);
        frag.append(li);
    }
    els.list.append(frag);
    shown = end;
    els.more.hidden = shown >= results.length;
}

function pick(kind, id) {
    if (kind === 'school') { schoolId = id; els.school.value = schoolLabel(id); }
    else { majorId = id; els.major.value = majorLabel(id); }
    run();
    els.count.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function syncUrl() {
    const q = new URLSearchParams();
    if (lang !== 'zh') q.set('lang', lang);
    if (schoolId !== null) q.set('sid', S[schoolId][5]);
    else if (els.school.value.trim()) q.set('school', els.school.value.trim());
    if (majorId !== null) q.set('cip', M[majorId][2]);
    else if (els.major.value.trim()) q.set('major', els.major.value.trim());
    if (els.state.value) q.set('state', els.state.value);
    if (els.sort.value !== 'high') q.set('sort', els.sort.value);
    const qs = q.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
}

function restoreUrl(q) {
    els.state.value = q.get('state') || '';
    if (q.get('sort')) els.sort.value = q.get('sort');
    const sid = S.findIndex((s) => s[5] === q.get('sid'));
    if (sid >= 0) { schoolId = sid; els.school.value = schoolLabel(sid); }
    else els.school.value = q.get('school') || '';
    const mid = M.findIndex((m) => m[2] === q.get('cip'));
    if (mid >= 0) { majorId = mid; els.major.value = majorLabel(mid); }
    else els.major.value = q.get('major') || '';
}

// ---- copy deterrents (inputs keep normal behaviour) ----
const inField = (e) => e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach((ev) =>
    document.addEventListener(ev, (e) => { if (!inField(e)) e.preventDefault(); }));
document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === 's' || k === 'p' || k === 'u' || (!inField(e) && (k === 'a' || k === 'c')))) {
        e.preventDefault();
    }
});

// ---- wire up ----
let timer;
const debounced = () => { clearTimeout(timer); timer = setTimeout(run, 150); };
els.school.addEventListener('input', () => { schoolId = null; debounced(); });
els.major.addEventListener('input', () => { majorId = null; debounced(); });
els.state.addEventListener('change', run);
els.sort.addEventListener('change', run);
els.more.addEventListener('click', more);
els.reset.addEventListener('click', () => {
    schoolId = majorId = null;
    els.school.value = els.major.value = els.state.value = '';
    els.sort.value = 'high';
    run();
    els.school.focus();
});
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));

const query = new URLSearchParams(location.search);
let saved = null;
try { saved = localStorage.getItem('fs-earnings-lang'); } catch (e) {}
setLang(query.get('lang') || saved || 'zh');

try {
    const d = decode();
    S = d.s; M = d.m;
    P = [];
    for (let i = 0; i < d.p.length; i += 5) P.push(d.p.slice(i, i + 5));
    schoolHay = S.map((s) => norm([s[0], s[1], s[2], s[3]].join(' ')));
    majorHay = M.map((m) => norm([m[0], m[1], m[2]].join(' ')));
    [...new Set(S.map((s) => s[2]))].sort().forEach((st) => els.state.add(new Option(st, st)));
    restoreUrl(query);
    run();
} catch (e) {
    els.status.textContent = T.loadError;
}
})();
</script>
</body>
</html>
