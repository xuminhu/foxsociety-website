baseURL = 'https://www.foxsociety.com.cn'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.zh]
    contentDir = 'content/zh'
    title = '狐狸学社 | Fox Society'
    weight = 1
    [languages.zh.params]
      description = '专业国际升学指导，点亮名校之路'
      author = '狐狸学社'

  [languages.en]
    contentDir = 'content/en'
    title = 'Fox Society | 狐狸学社'
    weight = 2
    [languages.en.params]
      description = 'Professional international admissions guidance, lighting the way to top universities'
      author = 'Fox Society'

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5
