{{ define "styles" }}
<style>
.contact-hero {
    padding: 120px 2rem 4rem;
    background: linear-gradient(135deg, #f8f5f0 0%, #e8e0d5 100%);
    text-align: center;
}
.contact-hero h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    margin-bottom: 1rem;
}
.contact-card {
    max-width: 500px;
    margin: 4rem auto;
    padding: 3rem;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    text-align: center;
}
.contact-item {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 1.5rem;
    text-align: left;
}
.contact-item .icon {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #d4a574, #b8925f);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}
.qr-code {
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid rgba(0,0,0,0.08);
}
.qr-code img {
    width: 180px;
    border-radius: 12px;
}
@media (max-width: 768px) {
    .contact-hero {
        padding: 3rem 20px 2.5rem;
    }
    .contact-card {
        margin: 2rem 16px 3rem;
        padding: 2rem 1.5rem;
    }
}
</style>
{{ end }}

{{ define "main" }}
<section class="contact-hero">
    <h1>{{ i18n "contactTitle" }}</h1>
    <p>{{ i18n "contactSubtitle" }}</p>
</section>

<section class="contact-card">
    <div class="contact-item">
        <div class="icon">📍</div>
        <div>
            <div style="font-size: 13px; color: #666;">{{ i18n "contactAddressLabel" }}</div>
            <div style="font-size: 18px; font-weight: 600;">{{ i18n "contactAddress" }}</div>
        </div>
    </div>
    <div class="contact-item">
        <div class="icon">💬</div>
        <div>
            <div style="font-size: 13px; color: #666;">{{ i18n "wechat" }}</div>
            <div style="font-size: 18px; font-weight: 600;">foxsociety00133</div>
        </div>
    </div>
    <div class="qr-code">
        <img src="/images/wechat-qr.png" alt="{{ i18n "contactQrAlt" }}">
        <p style="margin-top: 15px; color: #666;">{{ i18n "contactQrText" }}</p>
    </div>
</section>
{{ end }}
